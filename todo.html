<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<link rel="manifest" href="/Tugasku/manifest.json">
<title>Tugasku</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root {
  --bg: #08080f;
  --surface: #111118;
  --surface2: #18181f;
  --border: rgba(255,255,255,0.07);
  --border-hover: rgba(255,255,255,0.13);
  --accent: #a78bfa;
  --accent2: #f472b6;
  --accent-glow: rgba(167,139,250,0.25);
  --text: #f1f0f5;
  --text-muted: #6b6880;
  --text-dim: #3a3848;
  --done-color: #3a3848;
  --red: #f87171;
  --red-bg: rgba(248,113,113,0.08);
  --green: #34d399;
}

body {
  font-family: 'Plus Jakarta Sans', sans-serif;
  background: var(--bg);
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  padding: 64px 16px 120px;
  color: var(--text);
}

/* Ambient background blobs */
body::before, body::after {
  content: '';
  position: fixed;
  border-radius: 50%;
  filter: blur(120px);
  pointer-events: none;
  z-index: 0;
}
body::before {
  width: 500px; height: 500px;
  background: radial-gradient(circle, rgba(167,139,250,0.12) 0%, transparent 70%);
  top: -100px; left: -100px;
}
body::after {
  width: 400px; height: 400px;
  background: radial-gradient(circle, rgba(244,114,182,0.08) 0%, transparent 70%);
  bottom: -100px; right: -100px;
}

.wrap {
  width: 100%;
  max-width: 520px;
  position: relative;
  z-index: 1;
}

/* Header */
.header {
  margin-bottom: 40px;
}

.greeting {
  font-size: 0.75rem;
  font-weight: 500;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--accent);
  margin-bottom: 10px;
}

h1 {
  font-size: 2.6rem;
  font-weight: 700;
  line-height: 1.1;
  letter-spacing: -0.04em;
  background: linear-gradient(135deg, #f1f0f5 30%, #a78bfa 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.stats-row {
  display: flex;
  gap: 20px;
  margin-top: 16px;
}

.stat {
  font-size: 0.8rem;
  color: var(--text-muted);
  font-weight: 400;
}

.stat span {
  color: var(--accent);
  font-weight: 600;
}

/* Input */
.input-wrap {
  display: flex;
  gap: 10px;
  margin-bottom: 32px;
}

.input-box {
  flex: 1;
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: 14px;
  padding: 15px 18px;
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 0.92rem;
  font-weight: 400;
  color: var(--text);
  outline: none;
  transition: border-color 0.2s, box-shadow 0.2s;
}

.input-box::placeholder { color: var(--text-dim); }

.input-box:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-glow);
}

.add-btn {
  background: var(--accent);
  color: #fff;
  border: none;
  border-radius: 14px;
  width: 52px;
  height: 52px;
  font-size: 1.4rem;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: transform 0.15s, background 0.2s, box-shadow 0.2s;
  flex-shrink: 0;
  box-shadow: 0 4px 20px var(--accent-glow);
}

.add-btn:hover {
  background: #c4b5fd;
  transform: scale(1.05);
  box-shadow: 0 6px 28px var(--accent-glow);
}
.add-btn:active { transform: scale(0.96); }

/* Filter tabs */
.filters {
  display: flex;
  gap: 6px;
  margin-bottom: 20px;
}

.filter-btn {
  background: none;
  border: 1.5px solid var(--border);
  border-radius: 20px;
  padding: 6px 16px;
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 0.78rem;
  font-weight: 500;
  color: var(--text-muted);
  cursor: pointer;
  transition: all 0.18s;
}

.filter-btn:hover {
  border-color: var(--border-hover);
  color: var(--text);
}

.filter-btn.active {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
  box-shadow: 0 2px 12px var(--accent-glow);
}

/* Task list */
.task-list {
  list-style: none;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.task-item {
  display: flex;
  align-items: center;
  gap: 14px;
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: 16px;
  padding: 16px 18px;
  animation: slideIn 0.24s cubic-bezier(0.34, 1.56, 0.64, 1);
  transition: border-color 0.2s, background 0.2s, transform 0.15s;
  cursor: default;
}

.task-item:hover {
  border-color: var(--border-hover);
  background: var(--surface2);
  transform: translateY(-1px);
}

.task-item.done {
  opacity: 0.5;
}

@keyframes slideIn {
  from { opacity: 0; transform: translateY(-12px) scale(0.97); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}

@keyframes popOut {
  to { opacity: 0; transform: scale(0.92); }
}

/* Custom checkbox */
.check {
  width: 22px; height: 22px; min-width: 22px;
  border-radius: 8px;
  border: 1.5px solid var(--text-dim);
  background: none;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.18s;
  flex-shrink: 0;
}

.check:hover { border-color: var(--accent); }

.check.checked {
  background: var(--accent);
  border-color: var(--accent);
  box-shadow: 0 0 12px var(--accent-glow);
}

.check svg {
  width: 12px; height: 12px;
  opacity: 0;
  transform: scale(0.5);
  transition: all 0.18s cubic-bezier(0.34, 1.56, 0.64, 1);
}

.check.checked svg {
  opacity: 1;
  transform: scale(1);
}

/* Task text */
.task-text {
  flex: 1;
  font-size: 0.93rem;
  font-weight: 400;
  color: var(--text);
  word-break: break-word;
  transition: color 0.2s;
  line-height: 1.5;
}

.task-item.done .task-text {
  color: var(--done-color);
  text-decoration: line-through;
  text-decoration-color: var(--text-dim);
}

/* Priority dot */
.priority {
  width: 7px; height: 7px;
  border-radius: 50%;
  flex-shrink: 0;
  background: var(--accent2);
  opacity: 0.6;
}

/* Delete button */
.del-btn {
  background: none;
  border: none;
  width: 28px; height: 28px;
  border-radius: 8px;
  color: var(--text-dim);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.18s;
  flex-shrink: 0;
  opacity: 0;
}

.task-item:hover .del-btn { opacity: 1; }

.del-btn:hover {
  background: var(--red-bg);
  color: var(--red);
}

/* Empty state */
.empty {
  text-align: center;
  padding: 60px 0 20px;
  display: none;
}

.empty.show { display: block; }

.empty-icon {
  font-size: 2.8rem;
  margin-bottom: 14px;
  filter: grayscale(0.3);
}

.empty-title {
  font-size: 1rem;
  font-weight: 600;
  color: var(--text-muted);
  margin-bottom: 6px;
}

.empty-sub {
  font-size: 0.82rem;
  color: var(--text-dim);
}

/* Clear done button */
.clear-row {
  display: flex;
  justify-content: flex-end;
  margin-top: 20px;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s;
}

.clear-row.show {
  opacity: 1;
  pointer-events: auto;
}

.clear-btn {
  background: none;
  border: none;
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 0.78rem;
  color: var(--text-dim);
  cursor: pointer;
  padding: 6px 10px;
  border-radius: 8px;
  transition: color 0.18s, background 0.18s;
}

.clear-btn:hover {
  color: var(--red);
  background: var(--red-bg);
}

/* Progress bar */
.progress-wrap {
  margin-bottom: 28px;
}

.progress-label {
  display: flex;
  justify-content: space-between;
  font-size: 0.75rem;
  color: var(--text-muted);
  margin-bottom: 8px;
}

.progress-bar {
  height: 4px;
  background: var(--surface2);
  border-radius: 4px;
  overflow: hidden;
}

.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--accent), var(--accent2));
  border-radius: 4px;
  transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
  width: 0%;
}
</style>
</head>
<body>
<div class="wrap">

  <div class="header">
    <p class="greeting">Dashboard</p>
    <h1>Tugasku</h1>
    <div class="stats-row">
      <p class="stat"><span id="totalCount">0</span> tugas</p>
      <p class="stat"><span id="doneCount">0</span> selesai</p>
      <p class="stat"><span id="leftCount">0</span> sisa</p>
    </div>
  </div>

  <div class="progress-wrap">
    <div class="progress-label">
      <span>Progress hari ini</span>
      <span id="pct">0%</span>
    </div>
    <div class="progress-bar">
      <div class="progress-fill" id="progressFill"></div>
    </div>
  </div>

  <div class="input-wrap">
    <input class="input-box" id="taskInput" type="text" placeholder="Apa yang mau kamu kerjain hari ini?" autocomplete="off"/>
    <button class="add-btn" id="addBtn" title="Tambah tugas">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" width="20" height="20">
        <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
      </svg>
    </button>
  </div>

  <div class="filters">
    <button class="filter-btn active" data-filter="all">Semua</button>
    <button class="filter-btn" data-filter="active">Belum</button>
    <button class="filter-btn" data-filter="done">Selesai</button>
  </div>

  <ul class="task-list" id="taskList"></ul>

  <div class="empty" id="emptyState">
    <div class="empty-icon">✦</div>
    <p class="empty-title">Kosong di sini</p>
    <p class="empty-sub">Tambah tugasmu di atas yuk!</p>
  </div>

  <div class="clear-row" id="clearRow">
    <button class="clear-btn" id="clearDone">Hapus semua yang selesai</button>
  </div>

</div>

<script>
let tasks = JSON.parse(localStorage.getItem('tugasku') || '[]');
let filter = 'all';

const taskInput  = document.getElementById('taskInput');
const addBtn     = document.getElementById('addBtn');
const taskList   = document.getElementById('taskList');
const emptyState = document.getElementById('emptyState');
const clearRow   = document.getElementById('clearRow');
const clearDone  = document.getElementById('clearDone');
const progressFill = document.getElementById('progressFill');

document.getElementById('addBtn').addEventListener('click', addTask);
taskInput.addEventListener('keydown', e => { if (e.key === 'Enter') addTask(); });

document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    filter = btn.dataset.filter;
    render();
  });
});

clearDone.addEventListener('click', () => {
  tasks = tasks.filter(t => !t.done);
  save(); render();
});

function addTask() {
  const text = taskInput.value.trim();
  if (!text) { taskInput.focus(); return; }
  tasks.unshift({ id: Date.now(), text, done: false });
  taskInput.value = '';
  taskInput.focus();
  save(); render();
}

function toggleTask(id) {
  const t = tasks.find(t => t.id === id);
  if (t) t.done = !t.done;
  save(); render();
}

function deleteTask(id) {
  const el = document.querySelector(`[data-id="${id}"]`);
  if (el) {
    el.style.animation = 'popOut 0.18s ease forwards';
    setTimeout(() => {
      tasks = tasks.filter(t => t.id !== id);
      save(); render();
    }, 180);
  }
}

function render() {
  const filtered = tasks.filter(t => {
    if (filter === 'active') return !t.done;
    if (filter === 'done')   return t.done;
    return true;
  });

  taskList.innerHTML = '';

  filtered.forEach(task => {
    const li = document.createElement('li');
    li.className = 'task-item' + (task.done ? ' done' : '');
    li.dataset.id = task.id;

    li.innerHTML = `
      <div class="check ${task.done ? 'checked' : ''}" data-id="${task.id}">
        <svg viewBox="0 0 12 10" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="1,5 4.5,8.5 11,1"/>
        </svg>
      </div>
      <span class="task-text">${escHtml(task.text)}</span>
      <button class="del-btn" data-id="${task.id}" title="Hapus">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" width="14" height="14">
          <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    `;

    li.querySelector('.check').addEventListener('click', () => toggleTask(task.id));
    li.querySelector('.del-btn').addEventListener('click', () => deleteTask(task.id));
    taskList.appendChild(li);
  });

  const total = tasks.length;
  const done  = tasks.filter(t => t.done).length;
  const left  = total - done;
  const pct   = total === 0 ? 0 : Math.round((done / total) * 100);

  document.getElementById('totalCount').textContent = total;
  document.getElementById('doneCount').textContent  = done;
  document.getElementById('leftCount').textContent  = left;
  document.getElementById('pct').textContent        = pct + '%';
  progressFill.style.width = pct + '%';

  emptyState.classList.toggle('show', filtered.length === 0);
  clearRow.classList.toggle('show', done > 0);
}

function escHtml(str) {
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function save() {
  localStorage.setItem('tugasku', JSON.stringify(tasks));
}

render();
</script>
</body>
</html>
